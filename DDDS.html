<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subjects - LearnHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#0ea5e9,#8b5cf6);
      color:#fff;
      padding:20px;
    }
    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:15px 10%;background:rgba(0,0,0,0.3);border-radius:10px;
      margin-bottom:30px;
    }
    .logo{font-size:1.5rem;font-weight:700}
    nav ul{display:flex;list-style:none;gap:20px}
    nav a{text-decoration:none;color:#fff;font-weight:600;transition:0.3s}
    nav a:hover{color:#38bdf8}
    h1{text-align:center;margin-bottom:20px}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:0 10%;
    }
    .card{
      background:rgba(0,0,0,0.5);
      padding:25px;
      border-radius:14px;
      text-align:center;
      box-shadow:0 6px 15px rgba(0,0,0,0.25);
      transition:0.3s;
    }
    .card:hover{transform:translateY(-6px)}
    .card h3{margin-bottom:10px}
    .card a{
      display:inline-block;
      margin-top:10px;
      padding:8px 14px;
      border-radius:8px;
      text-decoration:none;
      background:#0ea5e9;
      color:#fff;
      font-weight:600;
      transition:0.3s;
    }
    .card a:hover{background:#38bdf8}
  </style>
</head>
<body>
  <header>
    <div class="logo">📘 LearnHub</div>
   
  </header>

  <h1>All Subjects</h1>
  
  <div class="grid">
    <!-- Science Subjects -->
    <div class="card">
      <h3>SS1</h3>
      <p>Study life, organisms, and ecosystems.</p>
      <a href="eiyr.html">Open →</a>
    </div>
    <div class="card">
      <h3>SS2</h3>
      <p>Explore matter, reactions, and elements.</p>
      <a href="DSAWQ.html">Open →</a>
    </div>
    <div class="card">
      <h3>SS3</h3>
      <p>Learn forces, motion, and energy.</p>
      <a href="WQA.html">Open →</a>
    </div>
  
    
    </div>
  </div>
</body>
</html>
