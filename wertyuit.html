<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Section - LearnHub</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .quiz-container {
      background: rgba(0,0,0,0.7);
      padding: 25px;
      border-radius: 14px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      text-align: center;
    }
    h2 { margin-bottom: 20px; }
    .options { margin: 15px 0; }
    .option-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #0ea5e9;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .option-btn:hover { background: #38bdf8; }
    #next-btn {
      margin-top: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    #result {
      margin-top: 15px;
      font-size: 1rem;
      font-weight: 500;
      color: #fbbf24;
    }
    #scoreboard {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <h2 id="question">Loading Question...</h2>
  <div class="options" id="options"></div>
  <button id="next-btn">Next</button>
  <div id="result"></div>
  <div id="scoreboard"></div>
</div>

<script>
// ===== QUIZ QUESTIONS =====
const quizData = [
  {
    question: "What is the SI unit of force?",
    options: ["Newton", "Joule", "Pascal", "Watt"],
    answer: "Newton",
    explanation: "Force is measured in Newton (N), named after Sir Isaac Newton."
  },
  {
    question: "Who formulated the laws of motion?",
    options: ["Einstein", "Newton", "Galileo", "Faraday"],
    answer: "Newton",
    explanation: "Sir Isaac Newton formulated the three laws of motion."
  },
  {
    question: "What is the acceleration due to gravity on Earth?",
    options: ["9.8 m/s²", "6.67 m/s²", "3.0 m/s²", "1.6 m/s²"],
    answer: "9.8 m/s²",
    explanation: "On Earth, gravity pulls objects with an acceleration of 9.8 m/s²."
  },
  {
    question: "Which law states that energy cannot be created or destroyed?",
    options: ["Law of Conservation of Energy", "Ohm's Law", "Boyle's Law", "Hooke's Law"],
    answer: "Law of Conservation of Energy",
    explanation: "Energy can only change form; it cannot be created or destroyed."
  },
  {
    question: "What is the speed of light in vacuum?",
    options: ["3 x 10^8 m/s", "1.5 x 10^8 m/s", "3 x 10^6 m/s", "1 x 10^8 m/s"],
    answer: "3 x 10^8 m/s",
    explanation: "The speed of light in vacuum is approximately 300,000 km/s (3×10^8 m/s)."
  }
];

// ===== VARIABLES =====
let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 15;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("next-btn");
const resultEl = document.getElementById("result");
const scoreboardEl = document.getElementById("scoreboard");

// Shuffle questions each play
quizData.sort(() => Math.random() - 0.5);

function startTimer() {
  timeLeft = 15;
  resultEl.textContent = `⏳ Time Left: ${timeLeft}s`;
  timer = setInterval(() => {
    timeLeft--;
    resultEl.textContent = `⏳ Time Left: ${timeLeft}s`;
    if (timeLeft <= 0) {
      clearInterval(timer);
      selectAnswer("timeout");
    }
  }, 1000);
}

function loadQuestion() {
  clearInterval(timer);
  startTimer();
  let q = quizData[currentQuestion];
  questionEl.textContent = q.question;
  optionsEl.innerHTML = "";
  resultEl.textContent = `⏳ Time Left: ${timeLeft}s`;

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.classList.add("option-btn");
    btn.onclick = () => selectAnswer(opt);
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(selected) {
  clearInterval(timer);
  let correct = quizData[currentQuestion].answer;
  let explanation = quizData[currentQuestion].explanation;

  if (selected === correct) {
    score++;
  }

  nextBtn.style.display = "inline-block";
  Array.from(optionsEl.children).forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === correct) {
      btn.style.background = "#22c55e";
    } else if (btn.textContent === selected) {
      btn.style.background = "#ef4444";
    }
  });

  resultEl.textContent = `✅ ${explanation}`;
}

nextBtn.addEventListener("click", () => {
  currentQuestion++;
  if (currentQuestion < quizData.length) {
    loadQuestion();
    nextBtn.style.display = "none";
  } else {
    showResult();
  }
});

function showResult() {
  questionEl.textContent = "🎉 Quiz Completed!";
  optionsEl.innerHTML = "";
  nextBtn.style.display = "none";
  resultEl.textContent = `Your Score: ${score} / ${quizData.length}`;

  // Save High Score
  let highScore = localStorage.getItem("physics_highscore") || 0;
  if (score > highScore) {
    localStorage.setItem("physics_highscore", score);
    scoreboardEl.textContent = `🏆 New High Score: ${score}`;
  } else {
    scoreboardEl.textContent = `⭐ High Score: ${highScore}`;
  }
}

loadQuestion();
</script>

</body>
</html>
